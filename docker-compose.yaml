services:
  # 1. База данных
  db:
    image: postgres:15-alpine
    container_name: fastapi_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Брокер сообщений
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fastapi_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # Порт для очередей
      - "15672:15672" # Веб-интерфейс RabbitMQ (логин/пароль: guest/guest)

  # 3. Веб-сервер FastAPI
  web:
    build: .
    container_name: fastapi_app
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq

  # 4. Celery Worker (выполняет задачи)
  celery_worker:
    build: .
    container_name: celery_worker
    restart: always
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq

  # 5. Celery Beat (планировщик задач по расписанию)
  celery_beat:
    build: .
    container_name: celery_beat
    restart: always
    command: celery -A worker.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq

volumes:
  postgres_data:
